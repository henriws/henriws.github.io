<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Henri's Webpage</title>
<style>
    @font-face {
        font-family: 'Terminus';
        src: url(TerminusTTF-4.49.3.ttf) format('truetype');
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #000;
        color: #0f0;
        font-family: 'Terminus', monospace;
        display: flex;
        flex-direction: column;
        justify-content: space-between; /* top menu top, ASCII bottom */
        align-items: center;
        overflow: auto;
        text-shadow: 0 0 2px rgba(138,138,138,0.8),
                     0 0 4px rgba(151,154,151,0.5);
    }

    .background-gif {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 0;
        pointer-events: none;
        opacity: 0.5;
    }

    .background-gif img {
        max-width: 300px;
        width: 50vw;
        height: auto;
    }

    .stars {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: black;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
    }

    .stars::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 2px;
        height: 2px;
        background: white;
        border-radius: 50%;
        box-shadow:
            20vw 30vh white,
            50vw 80vh white,
            10vw 10vh white,
            70vw 50vh white,
            90vw 90vh white,
            30vw 70vh white,
            60vw 20vh white,
            80vw 10vh white,
            40vw 40vh white,
            15vw 60vh white,
            25vw 25vh white,
            35vw 15vh white,
            45vw 55vh white,
            55vw 35vh white,
            65vw 75vh white,
            75vw 5vh white,
            85vw 65vh white,
            95vw 45vh white,
            5vw 85vh white,
            12vw 12vh white;
        animation: twinkle 2.5s infinite alternate;
    }

    @keyframes twinkle {
        0% { opacity: 0.3; }
        50% { opacity: 0.8; }
        100% { opacity: 0.3; }
    }

    .top-menu {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        width: 100%;
        padding: 10px 0;
        z-index: 20;
        font-family: "Terminus", monospace;
        font-size: 16px;
    }

    .top-menu a {
        color: yellow;
        font-size: 22px;
        text-decoration: none;
        margin: 0 20px;
        cursor: pointer;
    }

    .top-menu a:hover {
        text-decoration: underline;
    }

    .container {
        position: relative;
        width: 100%;
        z-index: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-end; /* pushes ASCII to bottom */
        align-items: center;
        height: 100%;
    }

    .asci {
        color: #0f0;
        font-size: 32px       
        white-space: pre;
        text-align: center;
        margin-bottom: 320px; /* spacing from bottom */
    }

    .crt-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9999;
        background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%),
                    linear-gradient(90deg, rgba(255,0,0,0.06), rgba(0,255,0,0.02), rgba(0,0,255,0.06));
        background-size: 100% 2px, 3px 100%;
        animation: flicker 0.15s infinite;
    }

    @keyframes flicker {
        0% { opacity: 0.27861; } 5% { opacity: 0.34769; } 10% { opacity: 0.23604; } 
        15% { opacity: 0.90626; } 20% { opacity: 0.18128; } 25% { opacity: 0.83891; } 
        30% { opacity: 0.65583; } 35% { opacity: 0.67807; } 40% { opacity: 0.26559; } 
        45% { opacity: 0.84693; } 50% { opacity: 0.96019; } 55% { opacity: 0.08594; } 
        60% { opacity: 0.20313; } 65% { opacity: 0.71988; } 70% { opacity: 0.53455; } 
        75% { opacity: 0.37288; } 80% { opacity: 0.71428; } 85% { opacity: 0.70419; } 
        90% { opacity: 0.7003; } 95% { opacity: 0.36108; } 100% { opacity: 0.24387; }
    }

     /* Optional subtle text glow on the whole page */
        body, .container, .top-menu, .cursor {
            text-shadow: 0 0 2px rgba(0,255,0,0.8),
                        0 0 4px rgba(0,255,0,0.5);
        }
        
</style>
</head>
<body>

<div class="stars"></div>

<div class="background-gif">
    <img src="earth.gif" alt="Earth GIF">
</div>

<div class="top-menu">
    <a href="#about">About</a>
    <a href="#projects">Projects</a>
    <a href="cv.html">CV</a>
    <a href="#contact">Contact</a>
</div>

<div class="container">
    <div class="crt-overlay"></div>
    <pre class="asci" id="asci"></pre>
</div>

<pre id="ascii-source" style="display:none; white-space: pre;">
    __  __                _              
   / / / /__  ____  _____(_)      _______
  / /_/ / _ \/ __ \/ ___/ / | /| / / ___/
 / __  /  __/ / / / /  / /| |/ |/ (__  ) 
/_/ /_/\___/_/ /_/_/  /_/ |__/|__/____/  
                                           
</pre>

<script>
const asciEl = document.getElementById('asci');
const asciText = document.getElementById('ascii-source').textContent.replace(/\n+$/, "");

function typeText(el, text, speed, callback) {
    let i = 0;
    function typeChar() {
        if (i < text.length) {
            el.textContent += text.charAt(i);
            i++;
            setTimeout(typeChar, speed);
        } else if (callback) {
            callback();
        }
    }
    typeChar();
}

// Type ASCII art slowly
typeText(asciEl, asciText, 4);
</script>

</body>
</html>
