<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Henri's Webpage</title>
    <style>
        @font-face {
            font-family: 'Terminus';
            src: url(TerminusTTF-4.49.3.ttf) format('truetype');
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: rgb(255, 255, 255);
            font-family: "Terminus", monospace;
            font-size: clamp(16px, 2vw, 22px);
            line-height: 1.5em;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        .background-gif {
        position: fixed;   /* stays in place */
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%); /* perfectly centered */
        z-index: 0;        /* behind text and overlay */
        pointer-events: none; /* allow clicks to pass through */
        opacity: 0.5;      /* subtle, adjust as needed */
        }

        .background-gif img {
        max-width: 300px;  /* scale as needed */
        width: 50vw;       /* responsive size */
        height: auto;
        }

        .stars {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: black;
        z-index: 0; /* behind everything */
        pointer-events: none;
        overflow: hidden;
        }

        /* Generate random stars with box-shadow */
        .stars::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 2px;      /* tiny star size */
        height: 2px;
        background: white;
        border-radius: 50%;
        box-shadow:
            20vw 30vh white,
            50vw 80vh white,
            10vw 10vh white,
            70vw 50vh white,
            90vw 90vh white,
            30vw 70vh white,
            60vw 20vh white,
            80vw 10vh white,
            40vw 40vh white,
            15vw 60vh white,
            25vw 25vh white,
            35vw 15vh white,
            45vw 55vh white,
            55vw 35vh white,
            65vw 75vh white,
            75vw 5vh white,
            85vw 65vh white,
            95vw 45vh white,
            5vw 85vh white,
            12vw 12vh white;
        animation: twinkle 3s infinite alternate;
        }

        /* subtle twinkle effect */
        @keyframes twinkle {
        0% { opacity: 0.3; }
        50% { opacity: 0.8; }
        100% { opacity: 0.3; }
        }

        .top-menu {
        position: absolute;      /* fixed at top */
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        width: 100%;
        padding: 10px 0;
        z-index: 20;
        font-family: "Terminus", monospace;
        font-size: 16px;
        }

        .top-menu a {
        color: yellow;
        font-size: 22px;
        text-decoration: none;
        margin: 0 20px;
        cursor: pointer;
        }

        .top-menu a:hover {
        text-decoration: underline;
        }

        .container {
            max-width: 90%;
            white-space: pre; 
            text-align: left;
            z-index: 1;
            transform: none;
            text-shadow: none;
        }
        
        /* Header inline span for proper highlight */
        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header span {
            color: yellow;
            background-color: rgba(0, 0, 255, 0.584);
            display: inline-block;
            padding: 0 4px;
        }

        .projects {
            color: yellow;
        }

        .contact {
            color: #0f0;
        }

        .cursor {
        display: inline-block;
        width: auto;
        color: #0f0;
        animation: blink 1.75s infinite;
        }

        @keyframes blink {
        0%, 50%, 100% { opacity: 1; }
        25%, 75% { opacity: 0; }
        }

        a {
            text-decoration: underline;
            color: inherit;
        }

        a:hover {
            color: #ffffff;
        }

        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* let clicks go through */
            z-index: 9999; /* on top of everything */

            /* Scanlines + color tint */
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            animation: flicker 0.15s infinite;
        }

        /* CRT flicker keyframes (from your template) */
        @keyframes flicker {
        0% { opacity: 0.27861; }
        5% { opacity: 0.34769; }
        10% { opacity: 0.23604; }
        15% { opacity: 0.90626; }
        20% { opacity: 0.18128; }
        25% { opacity: 0.83891; }
        30% { opacity: 0.65583; }
        35% { opacity: 0.67807; }
        40% { opacity: 0.26559; }
        45% { opacity: 0.84693; }
        50% { opacity: 0.96019; }
        55% { opacity: 0.08594; }
        60% { opacity: 0.20313; }
        65% { opacity: 0.71988; }
        70% { opacity: 0.53455; }
        75% { opacity: 0.37288; }
        80% { opacity: 0.71428; }
        85% { opacity: 0.70419; }
        90% { opacity: 0.7003; }
        95% { opacity: 0.36108; }
        100% { opacity: 0.24387; }
        }

        /* Optional subtle text glow on the whole page */
        body, .container, .top-menu, .cursor {
            text-shadow: 0 0 2px rgba(0,255,0,0.8),
                        0 0 4px rgba(0,255,0,0.5);
        }
    </style>
</head>

<body>

    <div class="stars"></div>
    <div class="background-gif">
        <img src="earth.gif" alt="Earth GIF">
    </div>

    <div class="top-menu">
        <a href="#about">About</a>
        <a href="#cv">CV</a>
        <a href="#projects">Projects</a>
    </div>

    <div class="container">
        <div class="crt-overlay"></div>
        <div class="header" id="header"></div>
        <div class="body" id="body"></div>
        <div class="contact" id="contact"></div>
        <span class="cursor"></span>
    </div>

    <script>
        const headerText = `Henri Wilks-Stebbings`;

        const bodyText = `Department of Environment and Biodiversity
Division of Geology and Physical Geography
University of Salzburg
5020 Salzburg
Hellbrunnerstrasse 34
Room D-3.005`;

        const contactText = `Contact: henristewart.wilks-stebbings@plus.ac.at`;

        const headerEl = document.getElementById('header');
        const bodyEl = document.getElementById('body');
        const projectsEl = document.getElementById('projects');
        const contactEl = document.getElementById('contact');

        // Typing function for normal text
        // function typeText(el, text, speed, callback) {
        //     let i = 0;
        //     function typeChar() {
        //         if(i < text.length) {
        //             el.innerHTML += text.charAt(i) === '\n' ? '<br>' : text.charAt(i);
        //             i++;
        //             setTimeout(typeChar, speed);
        //         } else if (callback) {
        //             callback();
        //         }
        //     }
        //     typeChar();
        // }
        function typeText(el, text, speed, callback) {
    let i = 0;
    function typeChar() {
        if (i < text.length) {
            const char = text.charAt(i);
            if (char.match(/[0-9]/)) {
                el.innerHTML += `<span class="number">${char}</span>`;
            } else if (char === '\n') {
                el.innerHTML += '<br>';
            } else {
                el.innerHTML += char;
            }
            i++;
            setTimeout(typeChar, speed);
        } else if (callback) {
            callback();
        }
    }
    typeChar();
}

        // Typing function for header with inline span
        function typeHeader(el, text, speed, callback) {
            let i = 0;
            el.innerHTML = `<span></span>`; // create span
            const span = el.querySelector('span');

            function typeChar() {
                if(i < text.length) {
                    span.innerHTML += text.charAt(i) === '\n' ? '<br>' : text.charAt(i);
                    i++;
                    setTimeout(typeChar, speed);
                } else if (callback) {
                    callback();
                }
            }

            typeChar();
        }

        // Run typing in sequence
        // typeHeader(headerEl, headerText, 30, () => {
        // typeText(bodyEl, bodyText, 30, () => {
        // typeText(contactEl, contactText, 30);
        typeHeader(headerEl, headerText, 30, () => {
        typeText(bodyEl, bodyText, 30, () => {
        typeText(contactEl, contactText, 30, () => {
            // Append blinking cursor inside the contact element
            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            cursor.textContent = '▮'; 
            contactEl.appendChild(cursor);
        });
    });
});

</script>

</body>
</html>
