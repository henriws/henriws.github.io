    @font-face {
        font-family: 'Terminus';
        src: url(TerminusTTF-4.49.3.ttf) format('truetype');

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #000;
        color: #fff;
        font-family: 'Terminus', monospace;
        font-size: clamp(16px, 2vw, 22px);
        line-height: 1em;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        overflow: auto;
        text-shadow: 0 0 2px rgba(138,138,138,0.8),
                     0 0 4px rgba(151,154,151,0.5);
    }

    .background-gif {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 0;
        pointer-events: none;
        opacity: 0.5;
    }

    .background-gif img {
        max-width: 300px;
        width: 50vw;
        height: auto;
    }

    .stars {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: black;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
    }

    .stars::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 2px;
        height: 2px;
        background: white;
        border-radius: 50%;
        box-shadow:
            20vw 30vh white,
            50vw 80vh white,
            10vw 10vh white,
            70vw 50vh white,
            90vw 90vh white,
            30vw 70vh white,
            60vw 20vh white,
            80vw 10vh white,
            40vw 40vh white,
            15vw 60vh white,
            25vw 25vh white,
            35vw 15vh white,
            45vw 55vh white,
            55vw 35vh white,
            65vw 75vh white,
            75vw 5vh white,
            85vw 65vh white,
            95vw 45vh white,
            5vw 85vh white,
            12vw 12vh white;
        animation: twinkle 3s infinite alternate;
    }

    @keyframes twinkle {
        0%, 50%, 100% { opacity: 0.3; }
        25%, 75% { opacity: 0.8; }
    }

    .top-menu {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        width: 100%;
        padding: 10px 0;
        z-index: 20;
        font-family: "Terminus", monospace;
    }

    .top-menu a {
        color: yellow;
        font-size: 22px;
        text-decoration: none;
        margin: 0 20px;
    }

    .top-menu a:hover {
        text-decoration: underline;
    }

    .container {
        max-width: 90%;
        white-space: pre-wrap; 
        text-align: left;
        z-index: 1;
        margin-top: 60px;
    }

    /* .header {
            text-align: center;
            margin-bottom: 20px;

    .header span {
        text-align: center;
        margin-bottom: 0px;
        color: yellow;
        background-color: rgba(0, 0, 255, 0.584);
        display: inline-block;
        padding: 0 4px;
    }

    a {
        text-decoration: underline;
        color: inherit;
    }

    a:hover {
        color: #fff;
    }

    /* CRT overlay */
    .crt-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9999;
        background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%),
                    linear-gradient(90deg, rgba(255,0,0,0.06), rgba(0,255,0,0.02), rgba(0,0,255,0.06));
        background-size: 100% 2px, 3px 100%;
        animation: flicker 0.15s infinite;
    }

    /* @keyframes flicker {
        0% { opacity: 0.27861; }
        5% { opacity: 0.34769; }
        10% { opacity: 0.23604; }
        15% { opacity: 0.90626; }
        20% { opacity: 0.18128; }
        25% { opacity: 0.83891; }
        30% { opacity: 0.65583; }
        35% { opacity: 0.67807; }
        40% { opacity: 0.26559; }
        45% { opacity: 0.84693; }

        60% { opacity: 0.20313; }

        70% { opacity: 0.53455; }

        80% { opacity: 0.71428; }

        95% { opacity: 0.36108; }

      @keyframes flicker {
    0% { opacity: 0.4; }
    5% { opacity: 0.45; }
    10% { opacity: 0.35; }
    15% { opacity: 0.75; }
    20% { opacity: 0.3; }
    25% { opacity: 0.7; }
    30% { opacity: 0.55; }
    35% { opacity: 0.58; }
    40% { opacity: 0.38; }
    45% { opacity: 0.7; }
    50% { opacity: 0.8; }
    55% { opacity: 0.25; }
    60% { opacity: 0.35; }
    65% { opacity: 0.6; }
    70% { opacity: 0.5; }
    75% { opacity: 0.45; }
    80% { opacity: 0.6; }
    85% { opacity: 0.6; }
    90% { opacity: 0.6; }
    95% { opacity: 0.45; }
    100% { opacity: 0.35; }
}
