        .cursor {
        display: inline-block;
        width: auto;
        color: #00ffff;

            height: 100%;
            pointer-events: none; /* let clicks go through */
            z-index: 9999; /* on top of everything */

        function typeText(el, text, speed, callback) {
    let i = 0;
    function typeChar() {
        if (i < text.length) {
            const char = text.charAt(i);
            if (char.match(/[0-9]/)) {
                el.innerHTML += `<span class="number">${char}</span>`;
            } else if (char === '\n') {
                el.innerHTML += '<br>';
            } else {
                el.innerHTML += char;
            }
            i++;
            setTimeout(typeChar, speed);
        } else if (callback) {
            callback();
        }
    }
    typeChar();
}

        // Typing function for header with inline span
        function typeHeader(el, text, speed, callback) {
            let i = 0;
            el.innerHTML = `<span></span>`; // create span
            const span = el.querySelector('span');

            function typeChar() {
                if(i < text.length) {
                    span.innerHTML += text.charAt(i) === '\n' ? '<br>' : text.charAt(i);
                    i++;
                    setTimeout(typeChar, speed);
                } else if (callback) {
                    callback();
                }
            }

            typeChar();
        }
